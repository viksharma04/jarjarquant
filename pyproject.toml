[project]
name = "jarjarquant"
version = "0.1.1"
description = "Implements common financial ML techniques"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "polars>=1.31.0",
    "numpy>=2.1.1",
    "numba>=0.61.2",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "statsmodels>=0.14.4",
    "duckdb>=1.3.2",
    "pyarrow>=20.0.0",
    "python-dotenv>=1.1.1",
    "tqdm>=4.67.1",
    "joblib>=1.4.2",
]

[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "Cython",
    "numpy"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.12.0",
    "cython>=3.0.12",
    "setuptools>=75.1.0",
    "wheel",
]
